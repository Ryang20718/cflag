# schema reference: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: ci
on:
  workflow_call:
    inputs:
      test_keep_going:
        description: "Run the entire test suite and do not terminate on early failure"
        default: false
        type: boolean
    secrets:
      PRIVATE_REPO_PAT:
        required: true
      TRUNK_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      test_keep_going:
        description: "Run the entire test suite and do not terminate on early failure"
        default: false
        type: boolean
      run_sim_gating_tests:
        description: "Run all sim-gating tests"
        default: false
        type: boolean
      run_onboard_gating_tests:
        description: "Run all onboard-gating tests"
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["gh-readonly-queue/**", "trunk-merge/**"]

defaults:
  run:
    shell: bash

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read
  pull-requests: write # required for reading PR metadata & writing comments
  actions: write # needed for the concurrency/fail-fast cancellation of in-progress runs, and for retry_spot_instance re-running workflows
  checks: write # For trunk to post annotations
  statuses: write # to generate codecov status checks

jobs:
  ci:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: ${{ !inputs.test_keep_going }}
      matrix:
        include:
          - job: lint
            runner: ${{ contains(github.ref, 'trunk-merge') && fromJSON('["self-hosted","linux","x64","live","merge-cpu","on-demand"]') || fromJSON('["self-hosted","linux","x64","live","cpu"]') }}
            timeout: ${{ contains(github.event.pull_request.labels.*.name, 'long ci') && 120 || 60 }}
            container_options: '--user github_actions --oom-kill-disable --privileged'
            gpumon_options: ''
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-integration-test'
            disable_shm: true
            bazel_config: ''
            bep_suffix: 'lint'
            coverage_report_name: ''
            artifact_name: ''
            test_type: ''

          - job: cpu-test
            runner: ${{ contains(github.ref, 'trunk-merge') && fromJSON('["self-hosted","linux","x64","live","merge-cpu","on-demand"]') || fromJSON('["self-hosted","linux","x64","live","cpu"]') }}
            timeout: ${{ contains(github.event.pull_request.labels.*.name, 'long ci') && 240 || 120 }}
            container_options: '--user github_actions --oom-kill-disable --privileged'
            gpumon_options: ''
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-integration-test'
            disable_shm: true
            bazel_config: ''
            bep_suffix: 'cpu'
            coverage_report_name: ''
            artifact_name: ''
            test_type: ''

          - job: gpu-unit-test
            runner: ${{ contains(github.ref, 'trunk-merge') && fromJSON('["self-hosted","linux","x64","live","merge-gpu","on-demand"]') || fromJSON('["self-hosted","linux","x64","live","gpu","g6"]') }}
            timeout: ${{ contains(github.event.pull_request.labels.*.name, 'long ci') && 240 || 120 }}
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-integration-test'
            disable_shm: false
            bazel_config: 'test_gpu'
            bep_suffix: 'gpu'
            coverage_report_name: '_coverage_report_gpu_unit.dat'
            artifact_name: 'gpu'
            test_type: ''

          - job: gpu-exclusive-shard1-test
            runner: ${{ contains(github.ref, 'trunk-merge') && fromJSON('["self-hosted","linux","x64","live","merge-gpu","on-demand"]') || fromJSON('["self-hosted","linux","x64","live","gpu","g6"]') }}
            timeout: ${{ contains(github.event.pull_request.labels.*.name, 'long ci') && 240 || 120 }}
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-integration-test'
            disable_shm: false
            bazel_config: 'test_gpu_with_single_job_shard1'
            bep_suffix: 'gpu_shard1'
            coverage_report_name: '_coverage_report_gpu_exclusive_shard1.dat'
            artifact_name: 'gpu_shard1'
            test_type: ''

          - job: gpu-exclusive-shard2-test
            runner: ${{ contains(github.ref, 'trunk-merge') && fromJSON('["self-hosted","linux","x64","live","merge-gpu","on-demand"]') || fromJSON('["self-hosted","linux","x64","live","gpu","g6"]') }}
            timeout: ${{ contains(github.event.pull_request.labels.*.name, 'long ci') && 240 || 120 }}
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-integration-test'
            disable_shm: false
            bazel_config: 'test_gpu_with_single_job_shard2'
            bep_suffix: 'gpu_shard2'
            coverage_report_name: '_coverage_report_gpu_exclusive_shard2.dat'
            artifact_name: 'gpu_shard2'
            test_type: ''

          - job: sim-gating-scenario-0
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 45
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: false
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: 'scenario-0'

          - job: sim-gating-scenario-1
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 45
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: false
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: 'scenario-1'

          - job: sim-gating-domain-gap
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 45
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: false
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: 'domain-gap'

          - job: sim-gating-mode-verify-scenario
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 45
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: false
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: 'mode-verify-scenario'

          - job: sim-gating-mode-verify-replay
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 45
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: false
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: 'mode-verify-replay'

          - job: sim-gating-local-bridge-package
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 45
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: false
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: 'local-bridge-package'

          - job: onboard-gating-tests
            runner: ["self-hosted","linux","x64","live","merge-gpu","on-demand"]
            timeout: 90
            container_options: '--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all --runtime=nvidia --user github_actions --memory 61g --oom-kill-disable --privileged'
            gpumon_options: '--gpus all'
            aws_role: 'arn:aws:iam::223569079908:role/github-actions-live-av-run-dgnightly'
            disable_shm: true
            bazel_config: ''
            bep_suffix: ''
            coverage_report_name: ''
            artifact_name: ''
            test_type: ''
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ matrix.job }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    container:
      image: 223569079908.dkr.ecr.us-east-2.amazonaws.com/av-ci:2026-05-26-1779839121
      options: ${{ matrix.container_options }}
      volumes:
        - av_ci_user_cache_2004:/home/github_actions/.cache
        # Needed by the GPU legs: without this, bazel is unable to sandbox properly. This is due to bazel lacking
        # permissions to mount /proc/driver/nvidia, which is already mounted at container runtime.
        # This bind mount exposes the nested mounts similar to mount with --rbind option that bazel uses.
        - /proc:/github_actions_proc
        - /var/lib/systemd/coredump/:/var/lib/systemd/coredump/ # coredumps
        - /dev/shm:/dev/shm:rw,nosuid,nodev,exec # note, we mount tmpfs with exec which is required for building libglvnd
    services:
      # monitor gpu utilization and report metrics to cloudwatch
      # https://us-east-2.console.aws.amazon.com/cloudwatch/home?region=us-east-2#dashboards:name=GitHub-Actions
      #
      # DELIBERATE COMPROMISE of collapsing every leg into one matrix job:
      # `services:` keys cannot be conditionally omitted, so gpumon is always
      # declared. The CPU legs (lint, cpu-test) pass an empty `gpumon_options`,
      # so the container starts without `--gpus all`, finds no GPU and exits
      # immediately -- it costs a container start and reports nothing.
      gpumon:
        image: 223569079908.dkr.ecr.us-east-2.amazonaws.com/av-ci:gpumon-2023-01-03-1672765520
        options: ${{ matrix.gpumon_options }}
    # Only onboard-gating-tests needed these two before the collapse; they are
    # now set for every leg (harmless, but widened).
    env:
      FOXGLOVE_API_KEY_SSM_KEYPATH: ${{ vars.FOXGLOVE_API_KEY_SSM_KEYPATH }}
      ONBOARD_LOG_REPLAY_mcap_output_path: /tmp
    steps:
      # This must stay in the workflow: the local `./.github/actions/...`
      # composite actions below can only be resolved once the repo is on disk.
      - name: Checkout branch
        uses: waabi-ai/checkout@main
        with:
          lfs: true

      - name: Setup
        id: setup
        uses: ./.github/actions/ci_setup
        with:
          pat: ${{ secrets.PRIVATE_REPO_PAT }}
          aws_role: ${{ matrix.aws_role }}
          disable_shm: ${{ matrix.disable_shm }}
          test_keep_going: ${{ inputs.test_keep_going }}

      - name: Lint
        id: lint
        if: matrix.job == 'lint'
        uses: ./.github/actions/ci_lint
        with:
          pat: ${{ secrets.PRIVATE_REPO_PAT }}
          trunk_token: ${{ secrets.TRUNK_API_TOKEN }}
          test_keep_going: ${{ inputs.test_keep_going }}

      - name: CPU tests
        id: cpu
        if: matrix.job == 'cpu-test'
        uses: ./.github/actions/ci_cpu_test
        with:
          pat: ${{ secrets.PRIVATE_REPO_PAT }}
          test_keep_going: ${{ inputs.test_keep_going }}

      - name: GPU tests
        id: gpu
        if: startsWith(matrix.job, 'gpu-')
        uses: ./.github/actions/ci_gpu_test
        with:
          bazel_config: ${{ matrix.bazel_config }}
          bep_suffix: ${{ matrix.bep_suffix }}
          coverage_report_name: ${{ matrix.coverage_report_name }}
          artifact_name: ${{ matrix.artifact_name }}
          pat: ${{ secrets.PRIVATE_REPO_PAT }}
          test_keep_going: ${{ inputs.test_keep_going }}

      - name: Sim gating tests
        id: sim
        if: startsWith(matrix.job, 'sim-gating-')
        uses: ./.github/actions/ci_sim_gating
        with:
          test_type: ${{ matrix.test_type }}
          test_keep_going: ${{ inputs.test_keep_going }}

      - name: Onboard gating tests
        id: onboard
        if: matrix.job == 'onboard-gating-tests'
        uses: ./.github/actions/ci_onboard_gating
        with:
          test_keep_going: ${{ inputs.test_keep_going }}

      # Exactly one of the leg actions above runs, so collapse its exit code
      # into a single value for teardown and for the metadata artifact.
      - name: Resolve leg bazel exit code
        id: leg
        if: ${{ always() }}
        env:
          LINT_EXIT_CODE: ${{ steps.lint.outputs.bazel_exit_code }}
          LINT_HEAP_DUMP_EXIT_CODE: ${{ steps.lint.outputs.heap_dump_bazel_exit_code }}
          CPU_EXIT_CODE: ${{ steps.cpu.outputs.bazel_exit_code }}
          GPU_EXIT_CODE: ${{ steps.gpu.outputs.bazel_exit_code }}
          SIM_EXIT_CODE: ${{ steps.sim.outputs.bazel_exit_code }}
          ONBOARD_EXIT_CODE: ${{ steps.onboard.outputs.bazel_exit_code }}
        run: |
          set -euo pipefail
          bazel_exit_code=""
          heap_dump_bazel_exit_code=""
          for candidate in "${LINT_EXIT_CODE}" "${CPU_EXIT_CODE}" "${GPU_EXIT_CODE}" "${SIM_EXIT_CODE}" "${ONBOARD_EXIT_CODE}"; do
            if [[ -n "${candidate}" ]]; then
              bazel_exit_code="${candidate}"
              break
            fi
          done
          # lint reports the build/clippy/test exit codes together for the heap dump
          if [[ -n "${LINT_HEAP_DUMP_EXIT_CODE}" ]]; then
            heap_dump_bazel_exit_code="${LINT_HEAP_DUMP_EXIT_CODE}"
          else
            heap_dump_bazel_exit_code="${bazel_exit_code}"
          fi
          echo "bazel_exit_code=${bazel_exit_code}" >> "${GITHUB_OUTPUT}"
          echo "heap_dump_bazel_exit_code=${heap_dump_bazel_exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Teardown
        id: teardown
        if: ${{ always() }}
        uses: ./.github/actions/ci_teardown
        with:
          # sim-gating and onboard-gating legs produce no bazel event protocol file
          bep_file: ${{ matrix.bep_suffix && format('/tmp/test_{0}.json', matrix.bep_suffix) || '' }}
          heap_dump_name: ${{ matrix.job }}_heap_dump
          bazel_exit_code: ${{ steps.leg.outputs.heap_dump_bazel_exit_code }}
          trunk_token: ${{ secrets.TRUNK_API_TOKEN }}
          test_timestamp: ${{ steps.setup.outputs.test_timestamp }}
          ignore_junit_reports: ${{ matrix.job == 'lint' }}

      # All matrix legs of a job share ONE `outputs` map (last writer wins), so
      # per-leg values have to travel as artifacts instead. The downstream
      # retry-ci-steps-on-spot-reclamation and upload-metrics jobs read these.
      - name: Write CI leg metadata
        if: ${{ always() }}
        env:
          BAZEL_EXIT_CODE: ${{ steps.leg.outputs.bazel_exit_code }}
          INSTANCE_ID_IF_PREEMPTED: ${{ steps.teardown.outputs.instance_id_if_preempted }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-meta
          {
            echo "bazel_exit_code=${BAZEL_EXIT_CODE}"
            echo "instance_id_if_preempted=${INSTANCE_ID_IF_PREEMPTED}"
          } > "/tmp/ci-meta/${{ matrix.job }}.env"

      - name: Upload CI leg metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-meta-${{ matrix.job }}
          path: /tmp/ci-meta/${{ matrix.job }}.env

  # `ci-required` IS THE JOB THAT MUST BE SET AS THE REQUIRED STATUS CHECK IN
  # BRANCH PROTECTION. It replaces the old required checks `lint`, `cpu-test`,
  # `gpu-test` and `sim-gating-tests`.
  #
  # It also exists because of an edge case: if one matrix leg fails and another
  # is cancelled, the `ci` job is reported as cancelled.
  # However, github has an nuanced behavior where a cancelled job is counted as successful for the purposes of required status checks.
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/about-status-checks
  # Thus, we need to explicitly check the status of all needed jobs to ensure we always fail in the event of any failure/cancellation.
  ci-required:
    needs: [ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail unless every CI leg succeeded
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail
          if [[ "${CI_RESULT}" != "success" ]]; then
            echo "One or more CI legs failed/got cancelled (${CI_RESULT})!"
            exit 1
          fi

  retry-ci-steps-on-spot-reclamation:
    needs: [ci]
    runs-on: ubuntu-latest
    if: ${{ failure() && !contains(github.ref, 'trunk-merge') }}
    steps:
      - name: Checkout repository
        uses: waabi-ai/checkout@main

      - name: Download CI leg metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-meta-*
          path: /tmp/ci-meta
        continue-on-error: true

      - name: Collect preempted instance ids
        id: meta
        run: |
          set -euo pipefail
          read_field() {
            local job="$1"
            local key="$2"
            local file="/tmp/ci-meta/ci-meta-${job}/${job}.env"
            if [[ -f "${file}" ]]; then
              sed -n "s/^${key}=//p" "${file}" | head -n 1
            fi
          }
          {
            echo "lint_instance_id=$(read_field lint instance_id_if_preempted)"
            echo "cpu_instance_id=$(read_field cpu-test instance_id_if_preempted)"
            echo "gpu_unit_instance_id=$(read_field gpu-unit-test instance_id_if_preempted)"
            echo "gpu_exclusive_shard1_instance_id=$(read_field gpu-exclusive-shard1-test instance_id_if_preempted)"
            echo "gpu_exclusive_shard2_instance_id=$(read_field gpu-exclusive-shard2-test instance_id_if_preempted)"
          } >> "${GITHUB_OUTPUT}"

      - name: Re-run CI steps if spot-instance was reclaimed by EC2
        uses: ./.github/actions/retry_spot_instance
        with:
          lint_instance_id: ${{ steps.meta.outputs.lint_instance_id }}
          cpu_instance_id: ${{ steps.meta.outputs.cpu_instance_id }}
          gpu_unit_instance_id: ${{ steps.meta.outputs.gpu_unit_instance_id }}
          gpu_exclusive_shard1_instance_id: ${{ steps.meta.outputs.gpu_exclusive_shard1_instance_id }}
          gpu_exclusive_shard2_instance_id: ${{ steps.meta.outputs.gpu_exclusive_shard2_instance_id }}
          run_id: ${{ github.run_id }}
        env:
          CONTEXT_GITHUB: ${{ toJson(github) }}
          role-to-assume: arn:aws:iam::223569079908:role/github-actions-live-av-integration-test
          role-skip-session-tagging: true
          aws-region: us-east-2

  coverage-upload:
    # we run on-demand only since it doesn't make sense to restart all jobs at the final given stage
    runs-on: ${{ contains(github.ref, 'trunk-merge') && fromJSON('["self-hosted", "linux", "x64", "live", "merge-cpu", "on-demand"]') || fromJSON('["self-hosted", "linux", "x64", "live", "cpu", "on-demand"]') }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'codecov-bypass') }} # skip codecov coverage upload if PR has codecov-bypass label
    needs: [ci]
    timeout-minutes: 5
    container:
      image: 223569079908.dkr.ecr.us-east-2.amazonaws.com/av-ci:2026-05-26-1779839121
      options: --user github_actions --oom-kill-disable --privileged # note, we mount tmpfs with exec which is required for building libglvnd
      volumes:
        - av_ci_user_cache_2004:/home/github_actions/.cache
        - /dev/shm:/dev/shm:rw,nosuid,nodev,exec # note, we mount tmpfs with exec which is required for building libglvnd
    steps:
      - name: Checkout branch
        uses: waabi-ai/checkout@main
        with:
          lfs: true
          fetch-depth: 2 # needed to fetch merge-base

      - name: Enable ASG scale-in protection
        id: asg_scale_in
        uses: ./.github/actions/asg_scale_in_protection
        with:
          update-flag: --protected-from-scale-in
        continue-on-error: true

      - name: Check for mandatory commit
        if: "github.event_name == 'pull_request'"
        uses: ./.github/actions/mandatory_commit
        with:
          mandatory_commit_tag: ci-mandatory-commit

      - name: Checkout LFS files
        uses: ./.github/actions/checkout_lfs

      - name: Create cache links
        uses: ./.github/actions/setup_cache

      - name: Setup CI user bazelrc file
        uses: ./.github/actions/bazel_create_homerc
        with:
          test_keep_going: "${{ inputs.test_keep_going }}"
          enable_bazel_disk_cache: true
          remote_cache: "aws_use2_cache"

      - name: Configure github access to other repositories
        uses: ./.github/actions/github_https_auth
        with:
          pat: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Get ECR docker auth token
        uses: aws-actions/amazon-ecr-login@2fc7aceee09e9e4a7105c0d060c656fad0b4f63d # v1
        env:
          AWS_REGION: us-east-2

      - name: Bazel cache cert/key
        uses: ./.github/actions/bazel_cache_cert
        with:
          role-to-assume: arn:aws:iam::223569079908:role/github-actions-live-av-bazel-cache
          aws-region: us-east-2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: arn:aws:iam::223569079908:role/github-actions-live-av-integration-test
          role-skip-session-tagging: true
          aws-region: us-east-2

      - name: Save AWS credentials to file for bazel rules and tests
        run: tools/bazel run //waabi/tools:aws -- dump_credentials_file_from_env

      - name: Clean Bazel Disk Cache
        uses: ./.github/actions/bazel_disk_cache

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/

      - name: Generate Source File Paths for Codecov yml
        run: |
          tools/bazel run //waabi/tools/codecov:lcov_tools -- generate \
            --diffcovPath $PWD/.diff_cover.toml \
            --generatedDiffcovPath /tmp/generated_diff_cover.toml

      - name: Split Lcov files
        run: |
          tools/bazel run //waabi/tools/codecov:lcov_tools -- split \
            --outputDir /tmp \
            --lcovPath /tmp/cpu/_coverage_report_cpu_unit.dat \
            --lcovPath /tmp/gpu/_coverage_report_gpu_unit.dat \
            --lcovPath /tmp/gpu_shard1/_coverage_report_gpu_exclusive_shard1.dat \
            --lcovPath /tmp/gpu_shard2/_coverage_report_gpu_exclusive_shard2.dat \
            --diffcovPath /tmp/generated_diff_cover.toml

      - name: Upload repo & av binary flag code coverage artifacts to s3
        if: "contains(github.ref, 'trunk-merge') || github.event_name == 'pull_request'"
        run: |
          if [[ "$GITHUB_REF" == *trunk-merge* ]]; then
            # trunk merge events are push events and branch names are of the format trunk-merge/pr-<pr-number>/merge-commit-hash
            PR_NUMBER="$(echo ${GITHUB_REF#refs/heads/} | grep -oP '(?<=pr-)\d+')"
          else
            PR_NUMBER="${{ github.event.number }}"
          fi
          aws s3 cp /tmp/repo_coverage.dat s3://waabi-av-ci-artifacts-data-live/coverage/${PR_NUMBER}/ || true
          aws s3 cp /tmp/av_binary_deps_coverage.dat s3://waabi-av-ci-artifacts-data-live/coverage/${PR_NUMBER}/ || true

      - name: Generate Patch Coverage
        id: patch_coverage
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: |
          git fetch origin ${GITHUB_BASE_REF}
          git fetch origin ${GITHUB_HEAD_REF}
          git diff origin/${GITHUB_BASE_REF}...origin/${GITHUB_HEAD_REF} > /tmp/diff.txt
          tools/bazel run //tools:diff_cover -- --help >/dev/null
          bazel-bin/tools/diff_cover -c $PWD/.diff_cover.toml /tmp/repo_coverage.dat --diff-file=/tmp/diff.txt --json-report /tmp/repo_patch.json --markdown-report /tmp/diff_coverage.md
          bazel-bin/tools/diff_cover -c /tmp/generated_diff_cover.toml /tmp/av_binary_deps_coverage.dat --diff-file=/tmp/diff.txt --json-report /tmp/av_binary_deps_patch.json

      - name: Generate Repo Coverage
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        id: total_coverage
        run: |
          tools/bazel run @lcov//:genhtml -- --help >/dev/null
          ignore_err="inconsistent,inconsistent,corrupt,category,category,count,count,range,range,source,source,missing"
          shared_flags="--quiet --ignore-errors ${ignore_err} --synthesize-missing"

          repo_project_coverage=$(bazel-bin/external/lcov+/genhtml ${shared_flags} \
          -o /tmp/repo_report \
          /tmp/repo_coverage.dat | grep -Po '(?<=lines.......: )[0-9]+(\.[0-9]+)?(?=%)')

          av_binary_deps_project_coverage=$(bazel-bin/external/lcov+/genhtml ${shared_flags} \
          -o /tmp/av_binary_deps_report \
          /tmp/av_binary_deps_coverage.dat | grep -Po '(?<=lines.......: )[0-9]+(\.[0-9]+)?(?=%)')

          echo "repo_project_coverage=${repo_project_coverage}" >> $GITHUB_OUTPUT
          echo "av_binary_deps_project_coverage=${av_binary_deps_project_coverage}" >> $GITHUB_OUTPUT

      - name: Generate Status Checks + Report
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/coverage_status_checks
        with:
          patch_coverage_json_file: /tmp/repo_patch.json
          patch_onboard_av_binary_coverage_json_file: /tmp/av_binary_deps_patch.json
          repo_coverage: ${{ steps.total_coverage.outputs.repo_project_coverage }}
          onboard_av_binary_coverage: ${{ steps.total_coverage.outputs.av_binary_deps_project_coverage }}
          diff_coverage_md_report: /tmp/diff_coverage.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Generated Files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          rm -rf /tmp/cpu
          rm -rf /tmp/gpu
          rm -rf /tmp/gpu_shard1
          rm -rf /tmp/gpu_shard2
          rm -rf /tmp/generated_diffcov.toml
          rm -rf /tmp/repo_coverage.dat
          rm -rf /tmp/av_binary_deps_coverage.dat
          rm -rf /tmp/diff.txt
          rm -rf /tmp/repo_report
          rm -rf /tmp/av_binary_deps_report
          rm -rf /tmp/repo_patch.json
          rm -rf /tmp/av_binary_deps_patch.json
          rm -rf /tmp/diff_coverage.md

      - name: Check for unexpected git changes
        uses: ./.github/actions/unexpected_git_changes

      - name: Disable ASG scale-in protection
        uses: ./.github/actions/asg_scale_in_protection
        if: ${{ always() }}
        with:
          update-flag: --no-protected-from-scale-in
        continue-on-error: true

  upload-metrics:
    needs: [ci, coverage-upload]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: waabi-ai/checkout@main

      - name: Download CI leg metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-meta-*
          path: /tmp/ci-meta
        continue-on-error: true

      # Per-leg exit codes come from the `ci-meta-*` artifacts because all
      # matrix legs share a single job `outputs` map.
      - name: Collect per-leg bazel exit codes
        id: meta
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail
          read_field() {
            local job="$1"
            local key="$2"
            local file="/tmp/ci-meta/ci-meta-${job}/${job}.env"
            if [[ -f "${file}" ]]; then
              sed -n "s/^${key}=//p" "${file}" | head -n 1
            fi
          }
          # Previously the `sim-gating-tests` roll-up job reported '0' when the
          # sim-gating matrix succeeded and '1' otherwise (including when it was
          # skipped). Reproduce that from the `ci` job result.
          sim_gating_exit_code=1
          if [[ -n "$(ls -d /tmp/ci-meta/ci-meta-sim-gating-* 2>/dev/null || true)" && "${CI_RESULT}" == "success" ]]; then
            sim_gating_exit_code=0
          fi
          {
            echo "lint_bazel_exit_code=$(read_field lint bazel_exit_code)"
            echo "cpu_test_bazel_exit_code=$(read_field cpu-test bazel_exit_code)"
            echo "gpu_unit_test_bazel_exit_code=$(read_field gpu-unit-test bazel_exit_code)"
            echo "gpu_shard1_test_bazel_exit_code=$(read_field gpu-exclusive-shard1-test bazel_exit_code)"
            echo "gpu_shard2_test_bazel_exit_code=$(read_field gpu-exclusive-shard2-test bazel_exit_code)"
            echo "sim_gating_matrix_bazel_exit_code=${sim_gating_exit_code}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log CI runtimes to Cloudwatch Metrics & Logs
        uses: ./.github/actions/log_to_cloudwatch
        env:
          CONTEXT_GITHUB: ${{ toJson(github) }}
        with:
          lint_bazel_exit_code: "${{ steps.meta.outputs.lint_bazel_exit_code }}"
          cpu_test_bazel_exit_code: "${{ steps.meta.outputs.cpu_test_bazel_exit_code }}"
          gpu_unit_test_bazel_exit_code: "${{ steps.meta.outputs.gpu_unit_test_bazel_exit_code }}"
          gpu_shard1_test_bazel_exit_code: "${{ steps.meta.outputs.gpu_shard1_test_bazel_exit_code }}"
          gpu_shard2_test_bazel_exit_code: "${{ steps.meta.outputs.gpu_shard2_test_bazel_exit_code }}"
          sim_gating_matrix_bazel_exit_code: "${{ steps.meta.outputs.sim_gating_matrix_bazel_exit_code }}"
