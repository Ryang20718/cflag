name: "Build"
description: "Run build steps"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install numpy
      shell: bash
      run: |
        uv pip install --system numpy

    - name: Run import check
      shell: bash
      run: |
        python3 -c "import time;import random; print(time.time()); time.sleep(random.randint(10, 15)); print(time.time())"
        exit 1
